name: Research QA checks
on:
  push:
    branches: [main, feature/research-qa-workbench]
  pull_request:

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install lightweight research dependencies
        run: python -m pip install pytest streamlit numpy pandas soundfile scipy plotly
      - name: Compile source
        run: python -m compileall -q lab research_app.py
      - name: Deterministic research QA suite
        run: python -m pytest -q tests/test_research.py
      - name: Streamlit application smoke test
        run: python -m pytest -q tests/test_research_ui.py
